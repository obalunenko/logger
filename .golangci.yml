version: "2"
run:
  issues-exit-code: 0
  tests: true
output:
  formats:
    text:
      path: stdout
    # Sonar reads this report (sonar-project.properties).
    checkstyle:
      path: report.xml
linters:
  default: all
  disable:
    - gochecknoglobals
    - mnd
    - paralleltest
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
    funlen:
      lines: 60
      statements: 40
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      enabled-checks:
        - docStub
        - rangeValCopy
        - yodaStyleExpr
        - appendCombine
        - commentedOutCode
        - commentedOutImport
        - emptyStringTest
        - indexAlloc
        - initClause
        - weakCond
        - hugeParam
        - nilValReturn
        - rangeExprCopy
        - ptrToRefParam
        - unnecessaryBlock
      settings:
        captLocal:
          paramsOnly: true
        hugeParam:
          sizeThreshold: 500
        rangeExprCopy:
          skipTestFuncs: true
        rangeValCopy:
          sizeThreshold: 320
        underef:
          skipRecvDeref: true
    gocyclo:
      min-complexity: 10
    godox:
      keywords:
        - NOTE
        - OPTIMIZE
        - HACK
        - TODO
        - BUG
        - FIXME
    govet:
      enable-all: true
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
    nakedret:
      max-func-lines: 30
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    unparam:
      check-exported: false
    wsl:
      strict-append: true
      allow-assign-and-call: true
      allow-assign-and-anything: false
      allow-multiline-assign: true
      force-case-trailing-whitespace: 0
      allow-trailing-comment: false
      allow-separated-leading-comment: false
      allow-cuddle-declarations: false
      allow-cuddle-with-calls:
        - Foo
        - Bar
      allow-cuddle-with-rhs:
        - Foo
        - Bar
      force-err-cuddling: false
      error-variable-names:
        - err
      force-short-decl-cuddling: false
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: exported func * returns unexported type *, which can be annoying to use
    paths:
      - \.pb\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/obalunenko/logger/
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
