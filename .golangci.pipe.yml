version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - revive
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    revive:
      severity: warning
      rules:
        - name: indent-error-flow
          severity: warning
        - name: exported
          severity: warning
        - name: defer
          arguments:
            - - call-chain
              - loop
              - method-call
              - recover
              - return
          severity: warning
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: exported func * returns unexported type *, which can be annoying to use
      - path: (.+)\.go$
        text: should have a package comment, unless it's in another file for this package
    paths:
      - \.pb\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/obalunenko/logger/
  exclusions:
    generated: lax
    paths:
      - \.pb\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
